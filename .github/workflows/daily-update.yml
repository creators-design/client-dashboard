name: Daily data refresh

on:
  schedule:
    - cron: "30 1 * * *"   # every day at 07:00 IST
  workflow_dispatch:        # lets you press "Run workflow" any time

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull latest numbers from Windsor.ai
        run: python fetch_data.py
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
      - name: Save data.json
        run: |
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Daily data refresh $(date -u +%F)"
          git push
